# Uncomment the following line to enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_I2C=y
CONFIG_SSD1306=y
CONFIG_ZMK_EXT_POWER=y

# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment this line below to add rgb underglow / backlight support
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Uncomment the line below to disable external power toggling by the underglow.
# By default toggling the underglow on and off also toggles external power
# on and off. This also causes the display to turn off.
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER

# Enable nice!oled
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_NICE_OLED_ON=y
CONFIG_NICE_EPAPER_ON=n
CONFIG_NICE_CUSTOM_ON=n

# Show modifier status with Luna instead of fixed Ctrl/Shift/Alt/GUI icons.
# CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=y
# CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED=n
# CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_LUNA=y
# CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_BONGO_CAT=n

# WPM display: enable only the speedometer.
CONFIG_NICE_OLED_WIDGET_WPM=y
# WPM number (disabled; enabled by default in the module).
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=n
# WPM speedometer.
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=n
# WPM graph.
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=n
# WPM Luna animation (enabled by default in the module).
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n
# WPM Bongo Cat animation.
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=y

# Show the Spaceman animation on the peripheral OLED.
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=y
# Pokémon disabled; show Gem instead.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_POKEMON=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=y
# Disable the default peripheral cat animation.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n

# Center the connection and battery widgets on the right OLED.
CONFIG_NICE_OLED_WIDGET_OUTPUT_USB_CUSTOM_X=8
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_CUSTOM_X=8
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_UNBONDED_CUSTOM_X=8
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_X=8

